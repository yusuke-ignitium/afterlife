[workspace]
resolver = "2"
members = [
    "crates/afterlife-core",
    "crates/afterlife-protocol",
    "crates/afterlife-storage",
    "crates/afterlife-daemon",
    "crates/afterlife-cli",
    "crates/afterlife-design",
    "crates/afterlife-ui",
    "tools/demos",
]
default-members = [
    "crates/afterlife-core",
    "crates/afterlife-protocol",
    "crates/afterlife-storage",
    "crates/afterlife-daemon",
    "crates/afterlife-cli",
    "crates/afterlife-design",
    "crates/afterlife-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
