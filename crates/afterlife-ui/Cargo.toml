[package]
name = "afterlife-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "afterlife-desktop"
path = "src/main.rs"

[dependencies]
afterlife-core = { path = "../afterlife-core" }
afterlife-daemon = { path = "../afterlife-daemon" }
afterlife-design = { path = "../afterlife-design" }
afterlife-protocol = { path = "../afterlife-protocol" }
afterlife-storage = { path = "../afterlife-storage" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync"] }
ureq = "2"
gpui = { path = "../../vendor/gpui", features = ["runtime_shaders"] }
cocoa = "0.26"
objc = "0.2"
