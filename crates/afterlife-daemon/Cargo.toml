[package]
name = "afterlife-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[[bin]]
name = "afterlifed"
path = "src/main.rs"
test = false

[dependencies]
afterlife-core = { path = "../afterlife-core" }
afterlife-protocol = { path = "../afterlife-protocol" }
afterlife-storage = { path = "../afterlife-storage" }
axum = "0.8"
base64 = "0.22"
hmac = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
ureq = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
